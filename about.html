    <meta charset="UTF-8" />

    <link

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <!-- Include GSAP library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      // import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";
      import {
        doc,
        getDoc,
        getFirestore,
      } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
      // TODO: Add SDKs for Firebase products that you want to use
      // https://firebase.google.com/docs/web/setup#available-libraries

      // Your web app's Firebase configuration
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      import { firebaseConfig } from "./firebaseConfig.js";
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      
      // change collection id as your account at firebase
      const howRef = doc(db, "about", "about");
      // Function to get document data

      const docSnap = await getDoc(howRef);
      const data = docSnap.data();
      const article = document.getElementById("a");
      var result = Object.keys(data).map((key) => [key, data[key]]);
      // console.log(result);
      article.innerHTML += `
      <div class="c1">
          <div class="part" id="i5">
            <h2 style="text-align: center;width:300px">${result[0][1].title}</h2>
            <p>
              ${result[0][1].dis}
            </p>
          </div>
          <div class="part" id="i1">
            <h2>${result[1][1].title}</h2>
            <p>
              ${result[1][1].dis}
            </p>
          </div>
        </div>
        <div class="c2">
          <div class="part" id="i4">
            <h2>${result[2][1].title}</h2>
            <p>
              ${result[2][1].dis}
            </p>
          </div>
          <div class="part" id="i2">
            <h2>${result[3][1].title}</h2>
            <p>
              ${result[3][1].dis}
            </p>
          </div>
        </div>
        <div class="c3">
          <div class="part" id="i3">
            <h2 style="text-align: center;width:300px">${result[4][1].title}</h2>
            <p>
              ${result[4][1].dis}
            </p>
          </div>
          <div class="" style="width: 430px;"></div>
        </div>
    `;
      const i1 = document.getElementById("i1");
      const i2 = document.getElementById("i2");
      const i3 = document.getElementById("i3");
      const i4 = document.getElementById("i4");
      const i5 = document.getElementById("i5");

      setInterval(() => {
        i1.style.opacity = "1";
      }, 3800);
      setInterval(() => {
        i2.style.opacity = "1";
      }, 4300);
      setInterval(() => {
        i3.style.opacity = "1";
      }, 6000);
      setInterval(() => {
        i4.style.opacity = "1";
      }, 6400);
      setInterval(() => {
        i5.style.opacity = "1";
      }, 7100);
    </script>

  </head>
