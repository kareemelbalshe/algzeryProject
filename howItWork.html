<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How It Work</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="web.svg" />
    <style>
      @media screen and (max-width: 600px) {
        .container .go-down {
          margin-top: 140px;
        }
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Include GSAP library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <!-- Include custom JavaScript file -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css "
    />
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      // import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";
      import {
        doc,
        getDoc,
        getFirestore,
      } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
      import { firebaseConfig } from "./firebaseConfig.js";
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const howRef = doc(db, "howItWork", "hiw");
      // Function to get document data

      const docSnap = await getDoc(howRef);
      const data = docSnap.data();
      const article = document.getElementById("h");
      var result = Object.keys(data).map((key) => [key, data[key]]);
      // console.log(result);
      article.innerHTML += `
        <div class="c1">
        <div class="part" id="i6">
          <h2>${result[0][1].title}</h2>
          <p>
            ${result[0][1].dis}
          </p>
        </div>
        <div class="part" id="i1">
          <h2>${result[1][1].title}</h2>
          <p>
            ${result[1][1].dis}
          </p>
        </div>
      </div>
      <div class="c2">
        <div class="part" id="i5">
          <h2>${result[2][1].title}</h2>
          <p>
            ${result[2][1].dis}
          </p>
        </div>
        <div class="part" id="i2">
          <h2>${result[3][1].title}</h2>
          <p>
            ${result[3][1].dis}
          </p>
        </div>
      </div>
      <div class="c3">
        <div class="part" id="i4">
          <h2>${result[4][1].title}</h2>
          <p>
            ${result[4][1].dis}
          </p>
        </div>
        <div class="part" id="i3">
          <h2>${result[5][1].title}</h2>
          <p>
            ${result[5][1].dis}
          </p>
        </div>
      </div>
    `;
      const i1 = document.getElementById("i1");
      const i2 = document.getElementById("i2");
      const i3 = document.getElementById("i3");
      const i4 = document.getElementById("i4");
      const i5 = document.getElementById("i5");
      const i6 = document.getElementById("i6");

      setInterval(() => {
        i1.style.opacity = "1";
      }, 3500);
      setInterval(() => {
        i2.style.opacity = "1";
      }, 4300);
      setInterval(() => {
        i3.style.opacity = "1";
      }, 5100);
      setInterval(() => {
        i4.style.opacity = "1";
      }, 6000);
      setInterval(() => {
        i5.style.opacity = "1";
      }, 6400);
      setInterval(() => {
        i6.style.opacity = "1";
      }, 7100);
    </script>
  </head>
  <body>
    <div class="white"></div>

    <div class="before"></div>
    <div class="after"></div>
    <canvas id="myCanvas"></canvas>

    <!-- <div class="dots dots-up"><img src="img/dots.png" alt="" /></div>
    <div class="dots dots-down"><img src="img/dots.png" alt="" /></div> -->
    <header>
      <div class="logo">
        <a href="index.html">
          <img src="web_HTML5 Canvas_Scene 2.svg" alt="" />
        </a>
      </div>
      <ul class="nav_menu">

        <li><a href="contact.html" style="--i: 2">Contact Us</a></li>
        <li><a href="about.html" style="--i: 3">About Us</a></li>

      <button id="open-menu-btn"><i class="fas fa-bars"></i></button>
      <button id="close-menu-btn"><i class="fas fa-times"></i></button>
    </header>
    <div class="container mm">

        <video width="720" height="720" muted autoplay="autoplay">
          <source src="img/web blue.mp4" type="video/mp4" />

        </video>
      </div>
      <div class="go-down">
        <i class="fas fa-angle-double-down fa-2x"></i>
